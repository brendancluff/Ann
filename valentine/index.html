<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A Valentine page for Kayla">
    <title>Kayla, will you be my Valentine?</title>

    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
  </head>

  <body>
    <main class="app" aria-live="polite">
      <!-- Screen 1 -->
      <section id="screen-ask" class="screen screen--active">
        <div class="hearts-row" aria-hidden="true">
          <span>💗</span><span>💗</span><span>💗</span><span>💗</span><span>💗</span>
          <span>💗</span><span>💗</span><span>💗</span><span>💗</span>
        </div>

        <h1 class="title">
          Kayla, will you<br>
          be my<br>
          Valentine? <span class="spark" aria-hidden="true">💞</span>
        </h1>

        <div class="buttons">
          <button id="yesBtn" class="btn btn--yes" type="button">
            Yes! <span aria-hidden="true">✨</span>
          </button>

          <button
            id="noBtn"
            class="btn btn--no"
            type="button"
            aria-label="No (this button moves)"
          >
            No
          </button>
        </div>

        <p class="hint">Tip: Try pressing “No” 😉</p>
      </section>

      <!-- Screen 2 -->
      <section id="screen-yay" class="screen" hidden>
        <div class="confetti" id="confetti" aria-hidden="true"></div>

        <div class="big-heart" aria-hidden="true">❤️</div>

        <h2 class="yay">YAY! <span aria-hidden="true">🎉</span></h2>
        <p class="sub">Best decision ever!</p>
        <p class="love">I LOVE YOU!! <span aria-hidden="true">😘</span></p>

        <button id="backBtn" class="btn btn--ghost" type="button">
          Back
        </button>
      </section>
    </main>
  </body>
</html>
